<!doctype html>
<!--
  Source of public/assets/og-image.png, the picture shown in link previews
  (Discord, iMessage, LinkedIn, ...). Regenerate with scripts/make-og-image.sh
  after editing. 1200x630 is the size every platform expects.

  The mountains are the site's own: make-og-image.sh copies the mountain
  landscape out of the built home page (dist/index.html) into the
  placeholder below. The colours are the autumn day palette at golden hour.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=block");

      * {
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        color: #38463e;
        font-family: "IBM Plex Sans", sans-serif;
        background-image: linear-gradient(
          180deg,
          #bccbd2 0%,
          #e6d2b4 50%,
          #f1c792 100%
        );
        position: relative;
        overflow: hidden;
      }

      .sun {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background-color: #ffe0ae;
        box-shadow:
          0 0 50px 20px rgba(255, 214, 150, 0.8),
          0 0 320px 150px rgba(255, 205, 140, 0.45);
        position: absolute;
        top: 300px;
        right: 190px;
      }

      .landscape {
        width: 100%;
        height: 300px;
        position: absolute;
        bottom: 0;
        left: 0;
      }

      .landscape .far {
        fill: #ddd0b9;
      }

      .landscape .mid {
        fill: #ddbf8e;
      }

      .landscape .ground {
        fill: #d1ae80;
      }

      .landscape .pine {
        fill: #a3b39b;
      }

      .landscape .leaf {
        fill: #eaa66f;
      }

      .landscape .snowcap {
        display: none;
      }

      .text {
        position: absolute;
        top: 84px;
        left: 88px;
      }

      .site {
        align-items: center;
        gap: 14px;
        font-size: 26px;
        display: flex;
      }

      .site img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
      }

      h1 {
        color: #14201a;
        margin: 36px 0 0;
        font-size: 112px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .tagline {
        margin-top: 22px;
        font-size: 32px;
      }
    </style>
  </head>
  <body>
    <div class="sun"></div>
    <!-- LANDSCAPE -->

    <div class="text">
      <div class="site">
        <img src="../public/assets/tokyo_pfp.png" alt="" />
        04klin.github.io
      </div>
      <h1>Kevin Lin</h1>
      <div class="tagline">Projects and photography</div>
    </div>
  </body>
</html>
