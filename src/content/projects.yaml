# Shown in ascending `order`. `context` is a few words on where a project
# came from; `about` is a sentence or two on what makes it interesting. Both
# are optional: a project with little to say can be just its title, tech and
# links.

- id: space-rover-mission
  order: 1
  title: Space Rover Mission
  context: IBM, Open Liberty
  about: >-
    An open-source game where you steer a real rover across a game board with
    hand gestures, run by Java microservices. I'm adding a free roam mode.
  links:
    - text: Repository
      url: "https://github.com/OpenLiberty/space-rover-mission"
  tech: [Java, Open Liberty, Jakarta EE, MicroProfile, React, OpenCV, Arduino]

- id: openmt
  order: 2
  title: OpenMT
  context: Side project
  about: >-
    A self-hosted tracker for anime, manga, manhwa, TV, movies and books. One
    search covers AniList, TMDB, MangaUpdates and Open Library at once, and a
    discovery page keeps up with what's trending and what's coming out.
  tech: [Next.js, React, TypeScript, SQLite, Drizzle, TanStack Query, Tailwind]

- id: quote-bot
  order: 3
  title: Quote Bot and Quotehoot
  context: Side project
  about: >-
    A Discord bot that turns a server's quote channels into a searchable
    archive, then makes games out of it: guess who said a random quote, or
    play Quotehoot, a live Kahoot-style "who said it?" quiz on your phone.
  tech: [Node.js, TypeScript, Express, SQLite, WebSockets, Podman]

- id: self-driving-cars
  order: 4
  title: Self-Driving Car
  context: Coursework
  about: Lane following, and stopping at stop signs it spots with YOLO.
  links:
    - text: Demo videos
      url: "https://www.youtube.com/playlist?list=PLnUax5602s6aKakl6MddQApi4Lxbcdk1r"
  tech: [Python, YOLO, ROS2, OpenCV]

- id: repo-replay
  order: 5
  title: Repo Replay
  context: Coursework
  about: >-
    Plays back the commit history of a single file, so teaching staff can see
    what a student tried on an assignment without digging through the code.
  links:
    - text: Poster
      url: "/assets/poster_and_pies.png"
    - text: Demo video
      url: "https://youtu.be/H1HVZ4pPBGg"
    - text: Source code
      url: "https://github.com/04klin/repo-replay"
  tech: [React, TypeScript, Spring, Java, PostgreSQL, Docker, Tailwind]

- id: bfs-paper
  order: 6
  title: Parallel Breadth-First Search
  context: Coursework
  about: >-
    How much faster can breadth-first search get on 16 cores? I compared
    top-down, bottom-up and hybrid versions. On a dense graph, atomic
    operations beat critical sections by up to 16x.
  links:
    - text: Paper
      url: "/assets/kevin_lin_final_paper_parallel_bfs_algorithms_and_optimizations.pdf"
  tech: [OpenMP, C++, Shell]

- id: liquid-rocketry-mission-control
  order: 7
  title: Mission Control
  context: Liquid Rocketry Lab
  about: >-
    The software the lab runs its rocket tests from. I led a team of four on
    it.
  links:
    - text: Lab website
      url: "https://liquidrocketry.com"
  tech: [React, Flask, Docker, MongoDB]

